<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser-tab icon. A dark tile rather than a transparent one: the mark's left
       wedge is near-black, and on a dark tab strip a transparent version loses it. -->
  <defs>
    <linearGradient id="blt-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd4ff" />
      <stop offset="1" stop-color="#0a63d6" />
    </linearGradient>
    <linearGradient id="blt-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8fef" />
      <stop offset="1" stop-color="#0b3f91" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070d" />

  <g transform="translate(10 12)">
    <path d="M4 3 L22 3 L40 20 L23 20 Z" fill="url(#blt-a)" />
    <path d="M4 20 L23 20 L40 20 L22 37 L4 37 Z" fill="url(#blt-b)" />
    <path d="M4 3 L4 37 L15 27 L15 13 Z" fill="#0a2a63" />
  </g>
</svg>
